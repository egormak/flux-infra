---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ingress-test
  namespace: monitoring
spec:
  interval: 1m
  url: https://github.com/egormak/fluxcd-test-app1
  ref:
    branch: master
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-test
  namespace: monitoring
spec:
  interval: 1m
  targetNamespace: monitoring
  sourceRef:
    kind: GitRepository
    name: ingress-test
  path: "./"
  prune: true
  timeout: 1m
