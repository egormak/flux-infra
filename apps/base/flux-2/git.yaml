---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: fluxcd-test-app2
  namespace: monitoring
spec:
  interval: 1m
  url: https://github.com/egormak/fluxcd-test-app2.git
  ref:
    branch: main
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: fluxcd-test-app2
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/ingress-chart  # Укажите путь к вашему чарту
      sourceRef:
        kind: GitRepository
        name: fluxcd-test-app2
        namespace: monitoring
      interval: 1m
